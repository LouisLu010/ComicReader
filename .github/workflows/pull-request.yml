name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  PROJECT: ComicReader.xcodeproj
  SCHEME: ComicReader
  TEST_DESTINATION: platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=18.5

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Xcode project
        run: bash .github/workflows/scripts/generate-project.sh

      - name: Build and run tests
        run: bash .github/workflows/scripts/run-tests.sh

      - name: Collect test diagnostics
        if: failure()
        run: bash .github/workflows/scripts/collect-test-diagnostics.sh

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comicreader-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ComicReaderTestDiagnostics/
          if-no-files-found: warn
          retention-days: 7
