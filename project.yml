name: ComicReader

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

attributes:
  LastUpgradeCheck: "1600"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    DEVELOPMENT_LANGUAGE: en

targets:
  ComicReader:
    type: application
    platform: iOS
    sources:
      - path: ComicReader
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: ComicReader
        PRODUCT_BUNDLE_IDENTIFIER: dev.louis.ComicReader
        INFOPLIST_FILE: ComicReader/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: true
      testTargets:
        - ComicReaderTests
        - ComicReaderUITests

  ComicReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ComicReaderTests
    dependencies:
      - target: ComicReader
    settings:
      base:
        PRODUCT_NAME: ComicReaderTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.louis.ComicReaderTests

  ComicReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ComicReaderUITests
    dependencies:
      - target: ComicReader
    settings:
      base:
        PRODUCT_NAME: ComicReaderUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.louis.ComicReaderUITests
        TEST_TARGET_NAME: ComicReader

schemes:
  ComicReader-CI:
    build:
      targets:
        ComicReader: all
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ComicReader
      targets:
        - name: ComicReaderTests
          parallelizable: true
        - name: ComicReaderUITests
          parallelizable: false

  ComicReader-Performance:
    build:
      targets:
        ComicReader: testing
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: ComicReaderTests
          parallelizable: false
      environmentVariables:
        - variable: COMICREADER_TEST_SUITE
          value: performance
          isEnabled: true
